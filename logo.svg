<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400" preserveAspectRatio="xMidYMid meet">
  <!-- Master SVG Logo for Awadh Gully -->
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .awadh-text { fill: #FAF7F2; }
        .awadh-icon { fill: #FAF7F2; }
      }
      
      @media (prefers-color-scheme: light) {
        .awadh-text { fill: #C9A24D; }
        .awadh-icon { fill: #C9A24D; }
      }
      
      .awadh-text {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-weight: 700;
        letter-spacing: 0.08em;
        transition: fill 0.3s ease;
      }
      
      .awadh-icon {
        transition: fill 0.3s ease;
      }
    </style>
  </defs>

  <!-- Islamic Arch (Dome) -->
  <g class="awadh-icon">
    <path d="M 600 150 Q 800 150 850 300 L 850 400 Q 800 380 600 380 Q 400 380 350 400 L 350 300 Q 400 150 600 150 Z" 
          fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Letter A with Lightning Bolt -->
  <g class="awadh-icon">
    <!-- Left stroke of A -->
    <line x1="480" y1="520" x2="380" y2="700" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Right stroke of A -->
    <line x1="720" y1="520" x2="820" y2="700" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Cross bar of A -->
    <line x1="450" y1="620" x2="750" y2="620" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Lightning bolt inside A -->
    <g stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="600,480 630,560 580,560 620,660"/>
    </g>
  </g>

  <!-- Cart Wheels -->
  <circle cx="420" cy="740" r="35" fill="none" stroke="currentColor" stroke-width="8" class="awadh-icon"/>
  <circle cx="780" cy="740" r="35" fill="none" stroke="currentColor" stroke-width="8" class="awadh-icon"/>
  
  <!-- Wheel spokes -->
  <g class="awadh-icon" stroke="currentColor" stroke-width="6">
    <line x1="420" y1="705" x2="420" y2="775"/>
    <line x1="385" y1="740" x2="455" y2="740"/>
    <line x1="395" y1="715" x2="445" y2="765"/>
    <line x1="395" y1="765" x2="445" y2="715"/>
    
    <line x1="780" y1="705" x2="780" y2="775"/>
    <line x1="745" y1="740" x2="815" y2="740"/>
    <line x1="755" y1="715" x2="805" y2="765"/>
    <line x1="755" y1="765" x2="805" y2="715"/>
  </g>

  <!-- Main Text: AWADH GULLY -->
  <text x="600" y="950" text-anchor="middle" class="awadh-text" font-size="140">AWADH GULLY</text>

  <!-- Tagline: FROM THE STREETS OF NAWABS -->
  <text x="600" y="1050" text-anchor="middle" class="awadh-text" font-size="56" letter-spacing="0.15em" opacity="0.95">FROM THE STREETS OF NAWABS</text>

  <!-- Accessibility label -->
  <title>Awadh Gully - Street Food from the Streets of Nawabs</title>
  <desc>Golden emblem logo featuring Islamic arch, letter A with lightning bolt, and cart wheels on transparent background</desc>
</svg>